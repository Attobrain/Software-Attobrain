<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Attobrain • Entrar</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/public/modules/styles/login.css" />
    <script src="/public/modules/login.js" type="module"></script>
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-brand" aria-label="Attobrain">
        <img src="/assets/attobrain-logo.svg" alt="Attobrain" class="login-logo" width="248" height="49" />
        <div class="login-message">
          <h1>Acompanhe sessões com clareza.</h1>
          <p>Organize participantes, conduza atividades e revise os registros em um só lugar.</p>
        </div>
        <img class="login-illustration" src="/assets/gaze-maze-vision.png" alt="" width="1000" height="667" fetchpriority="high" />
      </section>
      <section class="login-panel" aria-label="Acesso à plataforma">
        <div class="login-card">
          <div class="login-body">
            <h2>Entrar</h2>
            <p class="login-intro">Acesse seu espaço no Attobrain</p>
            <form id="login-form">
              <label for="login-email">E-mail</label>
              <input id="login-email" name="email" type="email" autocomplete="username" placeholder="nome@instituicao.com" required />
              <label for="login-password">Senha</label>
              <input id="login-password" name="senha" type="password" autocomplete="current-password" placeholder="••••••••••" required />
              <button type="submit">Entrar</button>
              <p id="login-erro" role="alert" aria-live="polite"></p>
              <button class="login-recovery" type="button" data-login-help>Esqueci minha senha</button>
              <p id="login-help" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
